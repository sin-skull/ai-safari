<!doctype html><html lang="ja"><meta charset="utf-8"><title>履歴なしのモデル確認</title>
<style>body{font:16px/1.6 system-ui;max-width:700px;margin:30px}textarea{display:block;width:100%;height:100px;font:inherit}pre{white-space:pre-wrap}button{padding:12px;margin:12px 0}</style>
<h1>履歴なしのモデル確認</h1><p>会話画面で取得済みのQwen3を使います。テストの会話履歴は保存しません。</p>
<textarea id="question" aria-label="質問">猫を飼う前に用意するものを3つ、日本語で短く教えてください。</textarea>
<button id="run">GPUで確認</button><pre id="result" role="status">待機中</pre>
<script type="module">
import { Wllama, CacheManager, LoggerWithoutDebug } from '../lab/vendor/wllama-3.6.1/index.js';
import { NamespacedOPFSBackend } from '../lab/storage.js';
import { PROFILES, buildConversation } from '../js/conversation-core.mjs';
const result = document.getElementById('result'), button = document.getElementById('run');
button.onclick = async () => {
  button.disabled = true;
  try {
    await navigator.locks.request('ai-safari-inference', {ifAvailable:true}, async (lock) => {
      if (!lock) throw new Error('先に会話画面のメモリを解放してください');
      const abs = (p) => new URL(p, location.href).href;
      const w = new Wllama({default:abs('../lab/vendor/wllama-3.6.1/wasm/wllama.wasm')}, {allowOffline:true, logger:LoggerWithoutDebug, cacheManager:new CacheManager([new NamespacedOPFSBackend('ai-safari-conversation-models')])});
      w.setCompat({worker:abs('../lab/vendor/wllama-compat-3.6.1/wasm/wllama.js'),wasm:abs('../lab/vendor/wllama-compat-3.6.1/wasm/wllama.wasm')});
      try {
        const model = (await w.modelManager.getModels()).find((m) => m.url === PROFILES.mobile.url);
        if (!model) throw new Error('会話画面で先にQwen3を取得してください');
        result.textContent = '読み込み中';
        await w.loadModel(await model.open(), {n_ctx:4096,n_gpu_layers:999,n_threads:1,n_batch:128,n_ubatch:128,n_parallel:1,warmup:false,default_template_kwargs:{enable_thinking:false}});
        result.textContent = '生成中';
        const start = performance.now(); let text = '';
        const stream = await w.createChatCompletion({messages:buildConversation(document.getElementById('question').value, [], [], PROFILES.pc),stream:true,max_tokens:PROFILES.pc.output,temperature:0.1,chat_template_kwargs:{enable_thinking:false}});
        for await (const chunk of stream) { text += chunk.choices?.[0]?.delta?.content || ''; result.textContent = text; }
        result.textContent += '\n所要時間: ' + ((performance.now()-start)/1000).toFixed(1) + '秒';
      } finally { await w.exit(); }
    });
  } catch (error) {result.textContent = error.message;}
  finally {button.disabled = false;}
};
</script></html>
